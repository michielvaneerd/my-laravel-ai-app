services:
  app:
    image: ${APP_IMAGE:-harbor.peercode.nl/lab/app/noble}
    container_name: ${APP_NAME}-app
    env_file:
      - .env
    volumes:
      - ./htdocs:/var/www/html:cached
      - ./docker/init-scripts/:/init-scripts/
      - ./docker/vhost.conf:/etc/apache2/conf-enabled/peerlab.conf
    ports:
      - ${APP_PORT_PREFIX:-}80:80
    depends_on:
      - mysql
    entrypoint:
      - /init-scripts/apache_start.sh
  mysql:
    image: ${MYSQL_IMAGE:-harbor.peercode.nl/lab/mariadb/noble}
    container_name: ${APP_NAME}-mysql
    env_file:
      - .env
    volumes:
      - mysql:/var/lib/mysql
      - ./docker_db_import/:/docker-entrypoint-initdb.d/
    ports:
      - ${APP_PORT_PREFIX:-}82:3306
    cap_add:
      - SYS_NICE
  maildev:
    image: ${MAILDEV_IMAGE:-harbor.peercode.nl/lab/maildev}
    container_name: ${APP_NAME}-maildev
    env_file:
      - .env
    ports:
      - ${APP_PORT_PREFIX:-}83:80
volumes:
  mysql:
    driver: "local"
